# nginx alternative (get the certificate with: certbot --nginx -d poll.ogun.se).
server {
    listen 80;
    server_name poll.ogun.se;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Overwrite, don't append: the app trusts the first value, so a client must not be able to supply it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
